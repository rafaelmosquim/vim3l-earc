[Service]
# Lip sync: the jitter buffer was the dominant term in the ~300 ms the TV path
# costs (see the latency budget of 2026-10-03). The sender delivers in ~30 ms
# bursts and the buffer measured 200 ms steady with a ~90 ms worst-minute
# spread, so 100 ms keeps ample headroom at half the delay.
Environment=EARC_PREFILL_MS=100
# pw-cat only has to cover its own scheduling - earc-recv.py absorbs the
# network and sender jitter - so 15 ms is enough and saves another 15.
Environment=EARC_LATENCY=15ms
