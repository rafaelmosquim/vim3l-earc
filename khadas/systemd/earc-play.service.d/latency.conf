[Service]
# The board-side equivalent of htpc/systemd/earc-in.service.d/latency.conf.
# Without it earc-recv.py uses its own 200 ms default, which is 100 ms more
# delay than the ProDesk ran -- straight onto the lip sync.
#
# 80 IS THE MEASURED PRACTICAL FLOOR, not a guess and not a leftover from
# experimenting -- do not "restore" it to 100 and do not cut it further.
# EARC_PREFILL_MS=60 was tried on 2026-10-24 and FAILED: 55 ms of inserted
# silence per settled minute, because the receiver's buffer swings ~35 ms and a
# 60 ms floor touches zero. Hitting zero is a silence insertion and a dropout,
# not a latency wobble.
#
# What the knob is: the fill target of earc-recv.py's jitter buffer -- the level
# playback starts at, and the level both the debt payback and the ceiling drop
# trim back to, so in steady state prefill IS this path's latency, 1 ms per ms.
# Only ONE of its three jobs went away with the LAN hop. It still absorbs the
# sender's ~30 ms burst granularity, and it still carries the ~160 ppm
# TV-clock-vs-UMC-crystal drift (~10 ms/min), which co-locating both ends does
# not change.
#
# Direction, so the next person does not reason it out backwards: this path is
# LATE, not early -- under 50 ms of residual lag on E-AC-3 by ear, of which
# 64 ms is inherent Dolby cost (32 ms IEC 61937 burst assembly + 32 ms decoder
# frame) and unrecoverable. Both levers are therefore already at their floor:
# prefill at 80 and eARC_RX Latency held at 0 by earc-latency-watch (higher
# register = MORE audio lag; the driver forces 100 at every link-up). There is
# nothing left to tune here without attacking the Dolby cost itself.
# UPDATE 2026-11-15 -- the floor above has MOVED; the history stays for context.
# Two fixes removed most of what the 80 had to absorb:
#   * earc-streamer read the format registers with `amixer` subprocesses
#     (~15 ms each, two every 250 ms) inside the loop that forwards audio, which
#     stalled DD+ frames ~30 ms. In-process libasound reads + 2.5 ms capture
#     periods took the arrival jitter from 34 ms to 5 ms peak-to-peak.
#   * earc-recv's stdout pipe (64 KiB default, permanently full: ~77 ms of
#     hidden latency nobody had measured) is now 8 KiB (~7 ms).
# Measured with the receiver's new `low` stat (lowest fill per interval) as a
# side listener on DD+: target 80 -> low 47, 55 -> low 28, 50 -> low 14,
# 45 -> low 9 ms. 55 keeps ~3x the 10 ms margin the old 80 actually had.
# If settled minutes ever show `silence inserted` > 0 again, go to 65.
Environment=EARC_PREFILL_MS=55
# EARC_LATENCY is not set here: it was pw-cat's, and there is no pw-cat now.
